<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flash Cards</title>
  </head>
  <body>
    <!--
      The shell. Everything inside #app is built by src/main.ts.

      Nothing here hardcodes the /flash-cards/ subpath: Vite rewrites the module
      path below at build time. Anything added to public/ would not be rewritten
      and would need the prefix by hand — see DESIGN.md, "The subpath".
    -->
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
